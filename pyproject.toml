[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mask-editor"
version = "0.1.0"
description = "Desktop editor for full-resolution binary PNG masks"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["Pillow>=9.1"]

[project.scripts]
mask-editor = "mask_editor.__main__:main"

[tool.setuptools.packages.find]
include = ["mask_editor*"]
